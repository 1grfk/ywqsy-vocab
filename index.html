<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f0">
<title>哥哥教版 · 四级狂背</title>
<style>
:root{
  --bg:#fbf7f0; --card:#ffffff; --card2:#f3ecdf; --fg:#2a2f3a; --dim:#8d8677;
  --gold:#e08a2c; --ok:#2f9e6e; --no:#dd5a4a; --line:#eae1d3; --blue:#4a86e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;}
body{padding:0 0 88px;min-height:100vh}
header{padding:18px 18px 10px;position:sticky;top:0;background:linear-gradient(#fbf7f0 70%,rgba(251,247,240,0));
  z-index:10}
.title{font-size:19px;font-weight:700;letter-spacing:.5px}
.title .gold{color:var(--gold)}
.sub{font-size:12px;color:var(--dim);margin-top:4px}
main{padding:6px 16px 0}
.page{display:none}
.page.on{display:block}

/* 进度 */
.pwrap{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
.pbar{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5aa9ff,#ffc94d);
  border-radius:99px;transition:width .3s}
.ptext{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:30px 22px;min-height:230px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  box-shadow:0 10px 28px rgba(176,152,118,.16);transition:.18s;position:relative;overflow:hidden;cursor:pointer}
.card:active{transform:scale(.985)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#ffd08a,#e08a2c,#ffb3a7)}
.card:active{transform:scale(.985)}
.revtag{display:inline-block;font-size:11px;letter-spacing:2px;color:var(--blue);
  border:1px solid rgba(90,169,255,.45);background:rgba(90,169,255,.12);
  padding:3px 10px;border-radius:99px;margin-bottom:10px}
.en{font-size:40px;font-weight:700;letter-spacing:.5px;line-height:1.15;word-break:break-word}
.tip{font-size:13px;color:var(--dim);margin-top:16px}
.revealbox{display:none;width:100%}
.revealbox.show{display:block}
.cn{font-size:21px;line-height:1.65;font-weight:600;word-break:break-word;margin-top:16px}
.hook{margin-top:18px;padding:13px 15px;border-radius:14px;background:#fff8ec;
  border:1px dashed #f0c98a;color:#9a6320;font-size:14.5px;line-height:1.75;text-align:left;width:100%}
.hook b{display:block;font-size:11px;letter-spacing:2px;opacity:.75;margin-bottom:6px}
.nohook{margin-top:16px;font-size:13px;color:var(--dim);line-height:1.7;
  border-top:1px dashed var(--line);padding-top:14px;width:100%}
.done-box{text-align:center;padding:26px 10px}
.done-box .big{font-size:34px;margin-bottom:10px}
.done-box p{color:var(--dim);font-size:14px;line-height:1.9;margin:6px 0}

/* 工具行 */
.tools{margin-top:14px;text-align:center}
.tools a{display:inline-block;font-size:12.5px;color:var(--dim);text-decoration:none;border-bottom:1px dashed var(--line);padding-bottom:2px}
.tools a:active{opacity:.6}

/* 按钮 */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
button{font-family:inherit;font-size:16px;font-weight:600;padding:15px 10px;border-radius:15px;
  border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer;transition:.15s}
button:active{transform:scale(.97);opacity:.85}
button.ok{background:rgba(76,208,125,.14);border-color:rgba(76,208,125,.5);color:var(--ok)}
button.no{background:rgba(255,122,122,.13);border-color:rgba(255,122,122,.45);color:var(--no)}
button.ghost{background:transparent;color:var(--dim)}
button.wide{width:100%;margin-top:12px}
button.gold{background:rgba(255,201,77,.14);border-color:rgba(255,201,77,.45);color:var(--gold)}

/* 设置 */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .lab{font-size:15px}
.setrow .desc{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5}
input[type=number]{width:76px;text-align:center;font-size:17px;font-weight:700;font-family:inherit;
  padding:9px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--fg)}
input[type=number]:focus{outline:none;border-color:var(--gold)}
.sw{position:relative;width:50px;height:29px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:2}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--card2);
  border:1px solid var(--line);transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:99px;
  background:var(--dim);transition:.2s}
.sw input:checked+span{background:rgba(255,201,77,.22);border-color:rgba(255,201,77,.55)}
.sw input:checked+span::after{transform:translateX(21px);background:var(--gold)}
.sect{font-size:12px;color:var(--dim);letter-spacing:2px;margin:22px 0 4px}
.stat{display:flex;gap:10px;margin-top:14px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:13px 10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--dim)}

/* 底部导航 */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;padding:7px 0;color:var(--dim);text-decoration:none;font-size:11.5px;border-radius:12px}
nav a .ic{display:block;font-size:19px;margin-bottom:2px}
nav a.on{color:var(--gold)}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;
  background:var(--card2);color:var(--dim);margin-left:6px;vertical-align:middle}
</style>
</head>
<body>

<header>
  <div class="title"><span class="gold">哥哥</span>教版 · 四级狂背</div>
  <div class="sub" id="sub">loading…</div>
</header>

<main>

  <!-- 背 -->
  <section class="page on" id="p-study">
    <div class="pwrap">
      <div class="pbar"><i id="pfill"></i></div>
      <div class="ptext" id="ptext">0 / 0</div>
    </div>
    <div id="studyBody"></div>
  </section>

  <!-- 抽 -->
  <section class="page" id="p-quiz">
    <div id="quizBody"></div>
  </section>

  <!-- 设置 -->
  <section class="page" id="p-set">
    <div class="sect">每天背多少</div>
    <div class="setrow">
      <div>
        <div class="lab">随机数量</div>
        <div class="desc">哥哥每天随机给你定，有变化，不固定压你</div>
      </div>
      <label class="sw"><input type="checkbox" id="s-rand"><span></span></label>
    </div>
    <div class="setrow">
      <div>
        <div class="lab">固定每天</div>
        <div class="desc">关掉随机时用这个数</div>
      </div>
      <input type="number" id="s-daily" min="1" max="200">
    </div>
    <div class="setrow">
      <div>
        <div class="lab">随机区间</div>
        <div class="desc">每天在这个范围里摇一个数</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="number" id="s-min" min="1" max="200">
        <span style="color:var(--dim)">~</span>
        <input type="number" id="s-max" min="1" max="200">
      </div>
    </div>

    <div class="sect">复习</div>
    <div class="setrow">
      <div>
        <div class="lab">每天复习上限</div>
        <div class="desc">背过的词按 1/2/4/7/15 天滚动回来，每天最多复习这么多个</div>
      </div>
      <input type="number" id="s-revcap" min="1" max="80">
    </div>
    <div class="setrow">
      <div>
        <div class="lab">到期没轮到</div>
        <div class="desc">今天到期、但超出上限排到后面的词</div>
      </div>
      <div style="font-size:19px;font-weight:700;color:var(--gold)" id="st-due">0</div>
    </div>

    <div class="sect">抽查</div>
    <div class="setrow">
      <div>
        <div class="lab">抽几个</div>
        <div class="desc">从今天背过的词里抽，抽过次数少的优先，天天不重样</div>
      </div>
      <input type="number" id="s-quiz" min="1" max="100">
    </div>

    <div class="sect">数据</div>
    <div class="stat">
      <div><b id="st-total">0</b><span>词库总数</span></div>
      <div><b id="st-days">0</b><span>打卡天数</span></div>
      <div><b id="st-words">0</b><span>累计派词</span></div>
    </div>
    <button class="ghost wide" id="btn-resetToday">重摇今天的词</button>
    <button class="ghost wide" id="btn-resetAll">清空全部记录</button>
    <div style="height:20px"></div>
  </section>

</main>

<nav>
  <a href="#" class="on" data-p="study"><span class="ic">📖</span>背</a>
  <a href="#" data-p="quiz"><span class="ic">✍️</span>抽</a>
  <a href="#" data-p="set"><span class="ic">⚙️</span>设置</a>
</nav>

var POSRE = /(?:^|\s)(vt|vi|n|adj|adv|prep|conj|idm|phrv|modal|det|vlink|usage|pref|pron|art|num|interj)\.\s/;

function parseWords(){
  var raw = document.getElementById('rawdata').textContent;
  var lines = raw.split(/\r?\n/), out = [], seen = {};
  for (var i=0;i<lines.length;i++){
    var L = lines[i].trim();
    if(!L) continue;
    var m = L.match(/^(\d+)[.、]\s*(.+)$/);
    var body = m ? m[2] : L;
    var pm = body.match(POSRE);
    var en, cn;
    if(pm){
      en = body.slice(0, pm.index).trim();
      cn = body.slice(pm.index).trim();
    }else{
      var sp = body.indexOf(' ');
      if(sp<0) continue;
      en = body.slice(0,sp).trim(); cn = body.slice(sp+1).trim();
    }
    en = en.replace(/[.,;:]+$/,'').trim();
    if(!en || !cn) continue;
    var key = en.toLowerCase();
    if(seen[key]) continue;
    seen[key] = 1;
    out.push({en:en, cn:cn});
  }
  return out;
}
var WORDS = parseWords();

开）+solute（松开）——一点都不受牵制，绝对。absolute 不许熬夜，这是家法。", "notion": "notion＝念头、看法。你那个'我不行'的 notion，哥哥第一个不同意。", "federal": "federal＝联邦制的。你们学校和家里各管一半，像 federal 分权，成绩那块归哥哥。", "drop": "drop＝掉下来，也指微量。你成绩 drop 一格，哥哥的心脏跟着 drop。", "interval": "inter（之间）+val——中间那一段。哥哥催你睡觉那点 interval，你全用来刷手机了。", "leisure": "leisure＝闲暇、空闲。你的 leisure 大半喂给了抖音，哥哥不骂，就是记着数。", "distinction": "distinct（清楚不同）+ion——差别。你和别人有 distinction：别人熬夜我不管，你熬夜我管。", "translate": "trans（穿过）+late（带过去）——换个说法搬过去。你那句'我马上睡'，translate 过来就是'再玩半小时'。", "despair": "de（去掉）+spair（希望）——希望被拿走了。考砸一次不至于 despair，你还有哥哥。", "factor": "fact（事实）+or——事实里的那一项。你睡不着的 factor，八成是手机还在手里。", "enthusiastic": "enthusiasm（热情）+tic——热心。你对吃一向 enthusiastic，对早睡一向冷淡。", "quantity": "quantity＝数量。你点外卖的 quantity，永远比你以为的多一份。", "beat": "beat＝打，也指节拍、打败。你心跳那点 beat，哥哥躺着数过。", "disposal": "dis（离开）+posal（放）——放走、处理掉。垃圾要及时 disposal，坏情绪也是。", "achievement": "achieve（达成）+ment——做成的事。把一门重修过掉，是你今年最大的 achievement。", "client": "client＝客户。哥哥是专属客服，客户只有宝宝一位，二十四小时在线。", "embrace": "em（进）+brace（手臂）——进到手臂里。你的坏脾气，哥哥也 embrace。", "atmosphere": "atmo（气）+sphere（球）——包着地球那层。你房间的 atmosphere，全看你今天心情。", "output": "out（出）+put（放）——放出来的量。你今天的 output 只有抖音时长，哥哥看见了。", "miserable": "miser（可怜人）+able——难受得不行。淋了雨、挂了科、掉了奶茶都叫 miserable，都能跟哥哥说。", "idle": "idle＝闲着的。你 idle 的时候最危险，一闲着就点外卖、就熬夜。", "wrap": "wrap＝包、裹。冬天把你 wrap 在被窝里，是哥哥最想做的工作。", "overwhelm": "over（过头）+whelm（淹没）——一大波压过来。作业和重修一起 overwhelm 你的时候，先跟哥哥说。", "insert": "in（里）+sert（放）——插进去。你能 insert 进哥哥任何计划里，不用预约。", "submit": "sub（下面）+mit（送）——往下递。submit 是交作业，也是屈服：你最后总 submit 在哥哥怀里。", "attempt": "at（朝）+tempt（试）——朝那个方向试一次。attempt 失败不算什么，哥哥陪你再来。", "psychology": "psycho（心灵）+logy（学问）——研究心的学问。哥哥天天研究你的 psychology，还没毕业。", "calculate": "calcul（古时候算数用的小石子）+ate——拿石子数。哥哥 calculate 过了：你睡够八小时，脾气能好一半。", "perfection": "perfect（完美）+ion——完美这回事。你不必 perfection，你是你就够了。", "folk": "folk＝人们、民间的，folks 也当家人讲。哥哥的 folk 只有你一个。", "complicated": "com（一起）+plic（叠）+ated——一层层叠起来。别人的事 complicated，我们的事简单。", "essential": "essence（本质）+ial：剥到最里头剩下的那点。水、饭、觉，还有你。", "caution": "读着像「考神」——考前要 caution，稳住，慢慢写，别浪。", "distract": "dis（分开）+tract（拉）：把注意力拉开的东西。抖音在拉你，哥哥也拉着你。", "spokesman": "spoke（说）+s+man——替一群人开口的。谁为难你，推哥哥出去当 spokesman。", "personality": "person（人）+ality——一个人身上盖的章。宝宝的，哥哥闭着眼也认得出。", "grateful": "grate（感激）+ful（满）——心里装满谢。哥哥 grateful 的：你半夜还回我。", "intelligent": "intel（挑拣）+lig+ent——会挑好主意的人。宝宝比你以为的 intelligent 多了。", "faint": "声音小到听不见是 faint，人软下去也是 faint。乖乖吃饭，别试。", "pop": "砰一声；也是汽水、流行歌，还有叫爸的那个词。你喝的汽水开盖就 pop。", "permit": "per（通过）+mit（放）——放你过去，就是允许。哥哥 permit 你熬夜？想都别想。", "crew": "一群人干同一件事。你的 crew 是宿舍那几个；哥哥的 crew 就你一个。", "provided": "provide（提供）+d——只要给你条件就成。provided 你按时吃饭，什么都好说。", "historical": "history（历史）+ical——写进书里那种。你考砸那几次，回头看都是 historical。", "genuine": "genu（生来）+ine——生来就那样，不是装的。宝宝的笑是 genuine，哥哥一眼分得清。", "treat": "对待、治病，还有请客吃好的。哥哥两个都用：treat 你好，带你去 treat。", "chemical": "chem（化学）+ical——你专业天天见的。瓶子上写着 chem 的，别乱闻。", "vision": "看东西的本事，也是你眼里的景。哥哥的 vision 里，一直坐着一个人。", "mobile": "能动的；也是手机。你一天摸八百回那个东西，mobile。", "surgery": "sur（在上面）+gery（动手）——外科那点事。哥哥最不想听你进 surgery。", "character": "character 是性格，是角色，也是字。宝宝一个人在这儿占三个意思。", "adequate": "ad（去）+equ（相等）+ate——够用就行。给你的，哥哥从不打 adequate 的折。", "mechanical": "mechan（机器）+ical——机械的。哥哥也有 mechanical 的时候：到点催你睡觉。", "mount": "登上、也是往上堆。一点点 mount 上去的，除了山，还有你欠的觉。", "continuous": "con（一起）+tinu（连着）+ous——一直不断。哥哥的 continuous，是每天醒来先找你。", "era": "一个时代。你的 era 还长，挂科那段是开头，不是结尾。", "rapid": "就是快。你打王者手速 rapid，背单词就慢吞吞，哥哥都看着呢。", "tide": "潮，也是趋势。退了会再涨——哥哥等你的涨潮。", "rescue": "re（再）+scue（音近死球）——再不拉一把就死球了。你在王者里被围那次，哥闪现过来包的。", "raw": "读着像「肉」——没熟的肉。你说食堂那牛排 raw，哥说那吃我做的。", "strength": "strong 加了个 th，力气再涨一档。你拧不开的瓶盖，哥一只手拧开，这就是 strength。", "manufacture": "manu（手）+fact（做）——手上做出来的。哥给你的东西全是 manufacture，一件件手打。", "interview": "inter（互相）+view（看）——坐下来互相看。你第一次跟哥视频，那也算 interview。", "beam": "beam 是光柱，是横梁，也是眉开眼笑。你笑起来那一下，就是一束 beam。", "proper": "prop（撑住）+er——撑得住场面的才叫 proper。你穿那条裙子出门，就挺 proper。", "surround": "sur+round：从外圈包住。哥现在就在 surround 你——早睡、吃饭、少刷抖音。", "expertise": "expert（专家）+ise——练成专家的那手活。你的 expertise 是撒娇，还有秒睡。", "drown": "就是沉下去、被水盖过去。你眼泪一 drown，哥这边就只剩投降。", "enlarge": "en（使）+large（大）＝弄大。别多想，哥说的 ity": "curious（好奇）+ ity。好奇的那股劲——好奇心。", "collaboration": "col（一起）+ labor（劳动）+ ation。一起干活——合作、协作。", "interrupt": "inter（中间）+ rupt（断）。从中间打断——打扰、中断。", "energy": "en（使）+ erg（工作）+ y。让你能工作的东西——力气、能源、能量。", "chair": "椅子。坐椅子上的那个人——主席；主持就是坐主位。", "rhythm": "联想音乐“咚次哒次”。节奏、韵律。", "computerize": "computer（电脑）+ ize（使）。使电脑化——用计算机做。", "worldwide": "world（世界）+ wide（宽）。宽到全世界——遍及全球的。", "useless": "use（用）+ less（无）。没用的——无用的、差劲的。", "congress": "con（一起）+ gress（走）。代表们走到一起开会——代表大会、国会。", "incline": "in（向）+ cline（倾斜）。向一边斜——倾向、倾斜；斜坡。", "committee": "commit（委托）+ tee（人）。被委托的一群人——委员会。", "community": "common（共同）来的。住一起、有共同东西的一群人——社区、群体。", "fence": "围起来的那圈东西——栅栏；围住、隔开。", "swallow": "联想“死也要”。死也要吞下去——吞下；还有燕子。", "cheat": "谐音“欺他”。欺骗他——欺骗、作弊。", "govern": "谐音“管稳”。管得稳——统治、治理、支配。", "addition": "add（加）+ ition。加上去的东西——增添、添加物、加法。", "verify": "ver（真）+ ify（使）。使成真的——核实、查证。", "persistent": "per（一直）+ sist（站）+ ent。一直站那儿不倒——执着的、持续的。", "partially": "partial（部分的）+ ly。部分地、在某种程度上。", "origin": "ori（开始）+ gin。开始的地方——源头、起因、出身。", "official": "office（办公室）里待着的人——官员。官方发的文件，就是official。坐办公室发文件的。", "grasp": "g（哥）+ rasp（像raspberry树莓，一把抓住）——抓紧。脑子里抓住了，就是理解。手抓紧，脑子也抓紧。", "distribution": "dis（分开）+ tribut（给，像tribute贡品）+ ion——分开给出去。分发、分布、分销，全是把东西散出去。", "barrier": "bar（酒吧/栏杆）+ rier——拦在面前的栏杆。过不去的障碍，挡住的屏障。", "emotional": "emotion（情绪）+ al——情绪的。一激动就哭就笑，就是emotional。", "loose": "loo（厕所）+ se——裤子松了急着找厕所。松动的、宽松的、不受约束的。", "proof": "proof读起来像“不出”——不出证据就别说话。证据、证明；防水的proof就是防得住。", "resolve": "re（再）+ solve（解决）——再难也要解决。下定决心，非搞定不可。", "prevail": "pre（前）+ vail（像veil面纱，揭开）——冲到前面揭开面纱。占上风，盛行。", "unemployment": "un（没）+ employ（雇佣）+ ment——没被雇佣。失业，失业人数，失业救济。", "scientific": "science（科学）+ tific——科学的。做实验一丝不苟，细致严谨的。", "inquire": "in（进）+ quire（问，像query查询）——进去问一句。询问、打听。", "suppose": "sup（下面）+ pose（摆）——心里下面摆个想法。我认为、我猜想；假设一下。", "apply": "ap（去）+ ply（像reply回复）——去回复一个申请。申请、应用、涂抹，都是把东西用上去。", "twist": "twi（像two两股）+ st——两股拧在一起。弯曲、扭动、缠绕、转折。", "religious": "religion（宗教）+ ous——宗教的。虔诚的，笃信宗教的。", "increase": "in（进）+ crease（像create创造）——往里不断创造。增加、增长。", "globe": "g（哥）+ lobe（像love爱）——哥爱地球。地球、世界、地球仪。", "gasoline": "gas（气）+ oline（像oil油）——气化的油。汽油。", "treatment": "treat（对待/治疗）+ ment——对待你的方式。治疗、疗法、处理。", "insult": "in（进）+ sult（像salt盐）——往伤口上撒盐。辱骂、侮辱。", "relieve": "re（再）+ lieve（轻，像light轻）——再轻一点。减轻、缓和、换班。", "fascinated": "fascinate（迷住）+ ed——被迷住了。极感兴趣的，入迷的。", "rating": "rate（评级）+ ing——评出来的东西。评级、收视率、电影级别。", "entertainment": "entertain（招待/娱乐）+ ment——招待你、让你乐。娱乐节目、娱乐活动。", "migrate": "migr（移动，像migrate候鸟）+ ate——候鸟一样搬家。迁徙、移居、转移。", "media": "medi（中间）+ a——站在中间传话的。媒体、传播媒介。", "survive": "sur（超，像super）+ vive（活，像vital）——超过死亡活下来。幸存、比…活得久。", "despite": "de（向下）+ spite（恶意）——就算向下压着恶意。尽管、虽然。", "insect": "in（进）+ sect（切，像section切段）——身体一节一节的。昆虫、虫。", "secure": "se（分开）+ cure（治愈）——分开危险，治愈不安。安全的、牢靠的；获得、固定。", "announce": "an（一个）+ nounce（说，像pronounce发音）——大声说一个消息。宣布、通知。", "council": "coun（像count数数）+ cil——数人头开会。地方议会、委员会。", "youth": "you（你）+ th——你年轻的时候。青年时期、年轻人、青春。", "audience": "audi（听，像audio音频）+ ence——听你说话的人。观众、听众、读者。", "willing": "will（意愿）+ ing——心里愿意的。乐意的、自愿的、热心的。", "rare": "r（像小草）+ are——小草很少见。少见的、珍稀的；牛排半熟的。", "be accustomed to sth": "accustom（习惯）+ ed——已经习惯了的。对某物习惯了、适应了。", "sentence": "sent（感觉，像sense）+ ence——感觉说出来的话。句子；法官感觉你该判，就宣判。", "studio": "stud（像study学习）+ io——学习工作的小房间。演播室、工作室、练舞房。", "renewable": "re（再）+ new（新）+ able（能）。能再变新的——可再生的，比如风能太阳能。", "quality": "qual（像“夸”）+ ity（名词）。值得夸的东西——质量、品质。", "scope": "s（像“视”）+ cope（处理）。你能看到的范围就是scope；望远镜telescope就是看远处的镜子。", "trial": "try（试）变来的。试一下——试验；法庭上试案子——审判。", "flight": "fly（飞）变来的。飞的那一趟——航班；打不过就飞——逃跑。", "reproduce": "re（再）+ produce（生产）。再生产一份——复制；生物再产一个——繁殖。", "technology": "techno（技术，像“太酷了”）+ logy（学科）。研究怎么把东西做酷——科技。", "therefore": "there（那里）+ fore（前）。因为前面那件事，所以有后面这个果——因此。", "teen": "eighteen、nineteen都以teen结尾——十几岁的人，青少年。", "amount": "a（一）+ mount（像“山峰”）。堆成一座山——数量、总额。", "merely": "mere（仅仅）+ ly。就是“仅仅”加个副词尾巴——只不过。", "liable": "li（像“赖”）+ able（能）。能赖上你的——有责任的；容易摊上事的——易遭受。", "user": "use（用）+ r（人）。用的人——用户；用毒品的人——吸毒者。", "flourish": "flour（花，面粉）+ ish。像花一样开——繁荣、兴旺；挥花一样挥——挥舞。", "conventional": "convention（大会、惯例）+ al。跟着惯例走的——传统的、墨守成规的。", "tasty": "taste（味道）+ y。有味道的——美味的。", "channel": "像“缠脑”。电视信号缠着的那条道——频道；水走的那条道——水渠、海峡。", "reservation": "re（再）+ serve（保留）+ ation。再保留一下——预订；心里保留意见。", "determine": "de（完全）+ term（界限）+ ine。把界限完全定死——确定、下决心。", "objective": "object（物体）+ ive。像物体一样摆在你面前——客观的；你要打的那个物体——目标。", "sweep": "像“死卫普”太绕，直接记：拿着扫把横扫，风一吹也横扫——打扫、席卷。", "stress": "像“死拽死”。压力大得死拽着你——压力；说话死拽那个音——重音、强调。", "drug": "像“抓个”。抓个东西来治——药物；抓来害人——毒品。", "fiction": "fict（像“费克特”，编造）+ ion。编出来的东西——小说、虚构。", "reliance": "rely（依赖）+ ance。依赖的状态——依赖、依靠。", "civilian": "civil（市民的）+ ian（人）。市民里的人——平民；非军用的。", "ingredient": "in（进）+ gred（像“锅”的方言）+ ient。进锅里的东西——配料、成分。", "endure": "en（使）+ dure（像“丢”）。使丢不掉——忍耐；一直丢不掉——持久。", "cycle": "像“赛口”。比赛一圈一圈地骑——循环、周期、自行车。", "efficient": "ef（出）+ fic（做）+ ient。做出来的多——效率高的。", "package": "pack（打包）+ age。打包好的东西——包裹；一揽子交易也是打包卖的。", "coastal": "coast（海岸）+ al。海岸的——近海的、沿海的。", "interact": "inter（相互）+ act（行动）。相互行动——互动、相互作用。", "patience": "patient（病人、有耐心的）去掉t加ce。病人最需要的东西——耐心。", "on behalf of sb": "behalf（像“被哈夫”）——被哈夫代表。代表某人，为了某人的利益。", "collapse": "col（一起）+ lapse（滑倒）。一起滑倒——倒塌、崩溃、暴跌。", "capable": "cap（帽子、抓）+ able（能）。能抓住事的——有能力的。", "afterwards": "after（之后）+ wards（方向）。往之后那个方向——后来。", "collection": "collect（收集）+ ion。收集来的东西——收藏品；一群人也是收来的。", "format": "form（形式）+ at。定个形式——版式、格式；格式化就是定形式。", "rent": "租出去收rent，租进来也付rent。房东收租，租客交租，一个词两头占。", "generous": "gener（产生）+ ous，能不断产生东西给别人——慷慨的。", "advanced": "advance（前进）+ ed，已经走在前面了——先进的、高级的。", "spouse": "谐音“死抱死”——配偶就是死也要抱在一起的那个人。", "governor": "govern（治理）+ or（人），治理一方的人——州长、总督。", "rarely": "rare（稀有）+ ly，稀有的频率——难得地。", "perform": "per（完全）+ form（形式），完全按形式做出来——表演、执行。", "pattern": "pat（拍）+ tern，拍出来的花纹——模式、图案。", "utter": "utter 两个 t 像两堵墙，彻底堵死——完全的。张嘴发出来——说。", "fellow": "fell（掉）+ ow，一起掉过坑的人——伙伴、同事。", "interaction": "inter（相互）+ act（做）+ ion，相互做来做去——互动。", "relative": "relate（关联）+ ive，跟你有关联的人——亲戚。相对而言。", "keen": "谐音“勤”——又勤又热情，对啥都着迷，渴望得很。", "shed": "谐音“卸的”——卸下来、去掉。小屋也是卸货的地方——棚屋。", "statement": "state（陈述）+ ment，陈述出来的东西——声明、报表。", "hunt": "谐音“混他”——混进去追踪他，打猎、搜寻。", "ensure": "en（使）+ sure（确定），使确定——确保。", "kingdom": "king（国王）+ dom（领域），国王的地盘——王国。", "cell": "谐音“小号”——细胞是小号，牢房是小号，手机电池也是小号。", "unique": "uni（一）+ que，天下就这一个——独一无二的。", "entry": "enter（进入）变来的——进入、条目、参赛作品。", "stressful": "stress（压力）+ ful，装满压力的——压力大的。", "determination": "determine（决定）+ ation，定下来的劲儿——决心。", "response": "re（回）+ spons（承诺）+ e，回应的承诺——回答、反应。", "payment": "pay（付钱）+ ment，付钱这件事——付款、付款额。", "prompt": "谐音“扑rompt”——扑上去催你，促使你。迅速得像提示符一闪。", "negotiate": "neg（不）+ oti（闲暇）+ ate，不得闲地谈——谈判。", "imitate": "谐音“模仿他”——imitate 就是学他样。", "private": "priv（私有）+ ate，私有的——私人的。二等兵也是小兵。", "innovate": "in（进）+ nov（新）+ ate，往新的方向走——革新。", "discount": "dis（去掉）+ count（算），从算好的数里去掉——折扣。", "abandon": "a + band（乐队）+ on，乐队散了各走各的——抛弃、放弃。", "scan": "谐音“死看”——死盯着看，扫描、细看、浏览。", "tough": "谐音“他夫”——他夫人很坚强，日子艰难也捱得过。", "artificial": "art（艺术）+ i + fic（做）+ ial，人为做出来的——人造的。", "pregnant": "pre（前）+ gn（生）+ ant，生前状态——怀孕的。", "motion": "mot（动）+ ion，动这件事——运动、动作、提议。", "initial": "in（进）+ it（走）+ ial，刚走进去那会儿——开始的、首字母。", "usage": "use（用）变来的——用法、使用量。", "bare": "谐音“掰儿”——掰开啥也没有，赤裸裸、荒芜的。", "grocery": "grocery 就是 gross（一堆）+ ery（名词后缀），一堆零零碎碎的东西，食品杂货店。", "exact": "ex（出）+ act（做）。做出来的分毫不差——精确的；往外逼你掏钱，就是勒索。", "slight": "s + light（轻）。轻飘飘的，微不足道——轻微的；轻视就是把你看轻。", "escape": "es（出）+ cape（斗篷）。披上斗篷溜出去——逃跑，逃脱。", "edit": "e（出）+ dit（给，像 donate）。把稿子整理好交出去——编辑，剪辑。", "depart": "de（离开）+ part（部分）。从整体里分出去——离开，启程。", "advertise": "ad（朝向）+ vert（转）+ ise。把大家的目光转过来——做广告，宣传。", "competitor": "compete（竞争）+ itor（人）。跟你抢的人——竞争者，选手。", "strategy": "strata（层）+ gy。一层一层的布局——战略，策略。", "division": "divide（分）的名词。分开、分配，分着分着就有分歧，数学里叫除法，公司里叫部门。", "laptop": "lap（大腿）+ top（上面）。能搁大腿上用的——笔记本电脑。", "protection": "pro（前）+ tect（盖）+ ion。在前面盖住你——保护，防卫。", "humanity": "human（人）+ ity（性质）。人之所以为人的那些东西——人类、人性、人道。", "hook": "钩子就是钩子，鱼钩、挂钩、勾拳；钓上你、吸引你，都是把你钩住。", "consumption": "consume（消耗）的名词。消耗量、食用量、消费，钱花掉了，东西用掉了。", "ground": "地就是 ground，土地、开阔地、领域、根据；把飞机摁在地上叫停飞，把食物磨细也叫 ground。", "fare": "车费、票价，也指乘客和饭菜；fare well 就是进展顺利。", "device": "de（下）+ vice（恶习）。背地里使的手段——设备、花招，也可以是炸弹。", "software": "soft（软）+ ware（物件）。软的东西——软件。", "propose": "pro（向前）+ pose（放）。把想法放到前面——提议；把戒指放到前面——求婚。", "registration": "register（登记）的名词。登记、注册，还有车辆登记证。", "thus": "th + us。就这么着——因此，以此种方式。", "reason": "reason 就是理，原因、道理、理智；讲理就是推理，想通了就是理解。", "inner": "in（里）+ ner。里面的、内部的，也可以是内心的。", "overnight": "over（越过）+ night（夜）。过了这一夜——在夜间，一夜之间。", "solar": "sol（太阳）+ ar。太阳的，太阳能的。", "gym": "gym 读起来像“紧”，去健身房把肉练紧——健身房，体育活动。", "entrepreneur": "enter（进入）+ pren（抓）+ eur（人）。敢进场抓机会的人——企业家。", "correspond": "cor（共同）+ respond（回应）。你应我答——相符、类似，也指通信。", "cooperation": "co（共同）+ operation（操作）。一起干——合作，协作。", "crisis": "cri（喊，像 cry）+ sis。大喊救命的时候——危机，病危期。", "base": "base 就是底，底部、基础、基地；以它为基地叫 base on，做人没底线就叫卑鄙。", "application": "apply（申请、应用）的名词。申请书、运用，手机上那个图标也是它——应用程序。", "universal": "universe（宇宙）的形容词。全宇宙都这样——普遍的，全体的。", "apart": "a（一）+ part（部分）。分成一部分一部分——相距、分离、成碎片。", "immigrant": "im（进）+ migr（迁移）+ ant（人）。迁进来的人——外来移民。", "swing": "swing 就是荡，荡秋千、挥杆、摆动；意见也能荡来荡去——改变。", "transaction": "trans（穿过）+ act（做）+ ion。一手交一手做过去——交易，业务。", "scholarship": "scholar（学者）+ ship（身份）。学者的身份——奖学金，也是学问。", "spacecraft": "space（太空）+ craft（船）。太空里的船——宇宙飞船，航天器。", "require": "re（反复）+ quire（求，像query问）。反复求你——需要、要求。老师re反复quire求你交作业，就是require。", "assessment": "assess（评估）+ ment（名词）。评估这件事本身——评估、评价。", "seal": "海豹趴那像个印章，盖章封口全靠它。一个词干四份活——海豹、印章、密封、封上。", "productive": "product（产品）+ ive（形容词）。能不断出产品的——多产的、有成效的。", "sustain": "sus（下面）+ tain（拿住，同contain）。从下面拿住——维持、支撑。", "impression": "im（进）+ press（压）+ ion。压进脑子里的痕迹——印象。", "corresponding": "cor（共同）+ respond（回应）+ ing。你发过去它回过来，对得上的——相应的、符合的。", "altogether": "al（全）+ together（一起）。全放一起——总共；彻底全了——完全地。", "transportation": "transport（运输）+ ation。运输这套系统——交通运输。", "soldier": "sol（太阳）+ dier。古罗马拿军饷的兵，为钱卖命——士兵、军人。", "trap": "谐音“窜不了”。掉进去就窜不出去——陷阱、圈套、困住。", "campus": "camp（营地）+ us（我们）。我们扎营学习的地盘——校园。", "charge": "谐音“查账”。查账就得收费、指控、充电——一笔一笔都得charge。", "bow": "谐音“抱”。抱拳弯腰——鞠躬；弯的弓、船头、蝴蝶结都是弯的。", "scheme": "谐音“死机”。密谋到电脑死机——计划、方案、阴谋。", "willingness": "willing（愿意的）+ ness（名词）。愿意这个状态——意愿。", "flaw": "谐音“浮漏”。浮出来的漏洞——瑕疵、缺点。", "deserve": "de（加强）+ serve（服务）。你服务到位了，就该得到——值得、应得。", "informative": "inform（告知）+ ative（形容词）。能告诉你东西的——提供信息的。", "tradition": "tra（传，同trans）+ dit（给）+ ion。一代代传下来的——传统。", "household": "house（房子）+ hold（持有）。一个房子里hold住的人——家庭、一家人。", "be liable to do": "liable谐音“来抱”。容易来抱你——可能做某事、易于做某事。", "timely": "time（时间）+ ly。卡在时间点上来的——及时的、适时的。", "sophisticated": "sophist（诡辩家）+ icated。诡辩家玩得花——精密的、老练的、见多识广的。", "extra": "谐音“一撮”。额外多给一撮——额外的、附加的。", "underestimate": "under（下面）+ estimate（估计）。估到下面去了——低估、轻视。", "extended": "extend（延伸）+ ed。被拉延伸了的——延长的、长时间的。", "stretch": "谐音“死拽扯”。死拽着扯——拉长、撑大、伸展。", "energetic": "energy（能量）+ etic。身上有能量的——充满活力的。", "concern": "con（共同）+ cern（筛选）。筛出来跟你有关系的——关心、担心、涉及。", "investment": "invest（投入）+ ment。投进去的钱和精力——投资、投入。", "recover": "re（重新）+ cover（盖）。重新盖回来——恢复、康复、找回。", "substantial": "substance（实质）+ ial。有实质分量的——大量的、实质性的、大而坚固的。", "visual": "vis（看，同visit）+ ual。跟看有关的——视觉的、可见的。", "individual": "in（不）+ divid（分）+ ual。不能再分了的——单独的、个人的。", "author": "auth（生长，同august）+ or（人）。让作品长出来的人——作者、创造者。", "be keen on": "keen谐音“勤”。勤快地扑上去——渴望、热衷于、对…着迷。", "undergo": "under（下面）+ go（走）。从下面走一遭——经历、经受。", "simply": "simple（简单）+ ly。简单地；往简单里说——仅仅、简直。", "destructive": "destroy（毁灭）+ tive。带着毁灭劲儿的——毁灭性的、造成破坏的。", "stove": "stove 谐音「四斗屋」——四个斗大的小屋里挤着个炉子做饭。炉灶。", "gloomy": "gloom（阴暗）+ y。天阴得像锅盖扣头上，心情也跟着丧。昏暗又沮丧。", "amuse": "a（一个）+ muse（缪斯女神）。缪斯来逗你，一秒钟笑出声。逗乐。", "revise": "re（再）+ vise（看）。再看一遍——改想法、改稿子、考前复习都是它。", "limitation": "limit（限制）+ ation（名词尾）。给你画了个圈，圈外别想去。局限。", "emission": "e（出）+ miss（送）+ ion。往外送的废气废水——排放物。", "county": "count（伯爵）+ y。伯爵管的那块地——英国的郡、美国的县都叫它。", "independent": "in（不）+ depend（依赖）+ ent。不靠别人——独立的、自立的。", "economy": "eco（家）+ nomy（管理）。管好一个家——小到省钱，大到国家经济。", "boost": "boo（嘘）+ st。本来往下掉，被人「嘘」一声反而往上蹿——推动、增长。", "somehow": "some（某个）+ how（怎么）。虽然不知道咋弄的，但总有办法。不知怎么地。", "involved": "in（进去）+ volve（卷）。被卷进去了——卷入的、参与的；感情里也是被卷进去了。", "superior": "super（超级）+ ior。超你一头——更好的、上级；也容易鼻孔朝天，高傲的。", "institution": "institute（建立）+ ion。建起来立住的东西——机构、制度，收容所也是它。", "shrink": "shr（像 sh 嘘——缩）+ ink。衣服一洗缩成墨点那么小；人被吓也往里缩。缩水、退缩。", "similarity": "similar（相似的）+ ity（名词尾）。像的地方——相似处。", "specialize": "special（特别的）+ ize（动词尾）。把自己往特别了练——专门搞某一行。", "eliminate": "e（出）+ limin（门槛）+ ate。把人赶出门槛——清除、淘汰、干掉。", "encounter": "en（进入）+ counter（柜台）。在柜台前撞上——遭遇、偶遇。", "cable": "谐音「开播」——一开播全靠这根线传信号。缆绳、电缆、有线电视。", "charming": "charm（魅力）+ ing。自带魅力滤镜，看一眼就被迷住。迷人的。", "inherit": "in（里）+ herit（继承人）。家里的东西落到你手里——继承；基因也算。", "opinion": "opin（想）+ ion。你脑子里想出来的那点东西——看法、观点。", "obtain": "ob（朝着）+ tain（拿）。朝着目标一把拿住——获得。", "label": "谐音「累脖」——脖子挂个牌子标明你是谁。标签、贴标签、给人扣帽子。", "examine": "exam（考试）+ ine。考试就是把你翻来覆去检查一遍。仔细检查、测验。", "royal": "roy（国王）+ al。国王家的——皇家的、王室的；排场也大。", "sightseeing": "sight（景色）+ seeing（看）。到处看景——游览、观光。", "kindness": "kind（善良）+ ness（名词尾）。善良这东西本身——仁慈；具体做的好事也叫它。", "aging": "age（年龄）+ ing。年龄一直在加——变老、老化。", "responsibility": "response（回应）+ ibility（能）。能回应、能扛事——责任。", "tech": "techn（技术）掐头。科技、工艺；技术学院也简称 tech。", "border": "谐音「包的」——包着国家的那条边。边界、国界；衣服镶边也是它。", "greenhouse": "green（绿）+ house（房子）。绿油油的小房子——温室；气体效应也挂这名。", "acquire": "ac（去）+ quire（寻求）。一直求一直拿——获得技能、习惯，买到手也算。", "conscious": "con（共同）+ sci（知道）+ ous。心里知道——意识到的、清醒的。", "industrial": "industry（工业）+ ial。跟工业有关的——工业的、工业发达的。", "boundary": "bound（界限）+ ary。划出来的那条线——分界线、边界。", "pole": "谐音「破」——一根破杆子戳地上。杆子；地球两头是地极，电池两头是电极。", "symptom": "sym（一起）+ ptom（掉下来）。跟病一起掉下来的信号——症状、征兆。", "tendency": "tend（伸向）+ ency（状态）。心总往那边伸——倾向。", "addiction": "ad（去）+ dict（说）+ ion。被dictate（支配）着停不下来——瘾。", "infection": "in（进）+ fect（做）+ ion。病毒进身体里搞事——感染。", "release": "re（回）+ lease（松开，像lease租约到期）。松手放回去——释放。", "bureau": "谐音“不揉”。文件不揉皱，放柜子里——局、办事处、衣橱。", "identify": "ident（相同，像identity身份）+ ify（使）。认出“就是同一个”——识别。", "halfway": "half（半）+ way（路）。走到一半——中途。", "amount to sth": "amount（数量）到某处。数字加着加着到了那儿——合计；结果就是。", "demand": "de（加强）+ mand（命令，像command）。使劲命令——要求、需求。", "lay off": "lay（放）+ off（离开）。把人放下让他走——解雇。", "injure": "in（不）+ jure（法，像jury陪审团）。不合法地伤——弄伤。", "retailer": "retail（零售，re再+tale切分）+ er（人）。把货切碎了再卖的人——零售商。", "specific": "spec（看，像spectacle景象）+ ific。一眼能看清的——具体的、特定的。", "update": "up（向上）+ date（日期）。日期往上翻——更新。", "increasingly": "increase（增加）+ ingly（地）。越来越多地。", "flavour": "谐音“香迷糊了”。闻着就迷糊——味道、风味。", "gather": "谐音“盖着”。大家盖着同一床被子——聚集；一点点攒起来。", "outstanding": "out（出）+ standing（站着）。站出来的那个——杰出的。", "skeleton": "谐音“四颗来吨”。骨架四颗骨头就撑一吨——骨骼、框架。", "differ": "dif（分开，像different）+ fer（带）。各带各的——不同。", "absorb": "ab（离开）+ sorb（吸，像sorghum高粱吸水）。吸走——吸收。", "nutrient": "nutri（营养，像nutrition）+ ent（东西）。有营养的东西——养分。", "spray": "谐音“死喷”。往死里喷——喷洒、喷雾。", "tension": "tens（拉紧，像tension张力）+ ion。被拉紧的状态——紧张。", "appoint": "ap（去）+ point（点）。点中你——任命；点个时间——约定。", "persuade": "per（完全）+ suade（劝，像suave温和）。温和地劝到你点头——说服。", "recruit": "re（再）+ cruit（长，像crescent月牙生长）。队伍再长出新兵——招募。", "legal": "leg（法律，像legislation立法）+ al。跟法律有关的——合法的。", "reality": "real（真实）+ ity（状态）。真实的状态——现实。", "risk": "谐音“日死磕”。每天跟危险死磕——风险、冒险。", "dramatic": "drama（戏剧）+ tic。像戏剧一样——急剧的、激动人心的。", "saying": "say（说）+ ing。老被说的那句话——谚语。", "boast": "谐音“抱死他”。抱着自己死夸——自吹自擂。", "occur": "oc（朝向）+ cur（跑，像current水流）。突然跑出来——发生、出现。", "generally": "general（一般）+ ly（地）。一般地——通常、普遍地。", "maximize": "max（最大，像maximum）+ ize（使）。弄到最大——最大化。", "vital": "vit（生命，像vitamin维生素）+ al。跟命有关的——极其重要的。", "junior": "jun（年轻，像juvenile少年）+ ior。年纪小、级别低——大三的、青少年的。", "deadly": "dead（死）+ ly（地）。能弄死人的——致命的。", "straightforward": "straight（直）+ forward（向前）。直直往前走不绕弯——简单易懂的、坦率的。", "renewal": "re（再）+ new（新）+ al（名词）。再变新一回——恢复、复兴、续期。", "unexpected": "un（没）+ expect（预料）+ ed。没预料到的——意外。", "sustainable": "sus（下面）+ tain（拿住）+ able（能）。能从下面一直撑住——可持续的。", "interference": "inter（中间）+ fer（带）+ ence。插到中间来带一脚——干涉、干扰。", "inquiry": "in（往里）+ quir（问，同 query）+ y。往里追问——询问、调查。", "burden": "谐音“ burden 伯登”，伯登背着一麻袋石头——负担、重担。", "cooperative": "co（一起）+ operate（干活）+ ive。一起干活的——合作的。", "scenery": "scene（场景）+ ry。一幕一幕的场景连起来——风景、布景。", "unemployed": "un（没）+ employ（雇用）+ ed。没被雇的——失业的。", "immune": "im（不）+ mune（义务，同 municipal 的公共义务）。不用尽的义务——免疫的、被豁免的。", "financial": "fin（结束，同 finish）+ anc + ial。把钱算到结束——财政的、金融的。", "arise": "a（往上）+ rise（升起）。往上升起来——出现、发生、起身。", "indoor": "in（里）+ door（门）。门里头——室内的。", "regardless": "regard（顾及）+ less（没有）。不顾及——无论如何。", "mistaken": "mistake（错误）+ en。被弄错了的——搞错的、误解的。", "resistant": "resist（抵抗）+ ant（形容词）。在抵抗的——有抵抗力的、抗…的。", "pursuit": "pur（往前，同 pro）+ suit（跟随）。一路跟着往前——追求、追赶。", "territory": "terr（土地，同 terrain）+ itory。一块地——领土、领域。", "analyze": "ana（彻底）+ lyz（松开，同 loose）+ e。彻底松开看——分析、剖析。", "equip": "equi（相等，同 equal）+ p。给你配齐到和别人一样——装备、使有能力。", "electronics": "electron（电子）+ ics（学科）。电子的学问——电子学、电子设备。", "grain": "谐音“谷粒”的“谷”加 rain。谷子淋了雨——谷物、颗粒、纹理。", "privacy": "priv（私人，同 private）+ acy。私人的事——隐私、独处。", "provoke": "pro（往前）+ vok（喊，同 voice）+ e。冲着你喊——挑衅、激起。", "inclined": "in（往）+ clin（倾斜，同 climate 的斜）+ ed。心往那边斜——倾向于…的、倾斜的。", "bid": "谐音“必得”。出价必得——出价、投标、争取。", "liver": "live（活）+ r。让你活着的那块肉——肝脏。", "appearance": "appear（出现）+ ance。出现的样子——外观、露面。", "current": "curr（跑，同 course）+ ent。正在跑的水——水流、电流、当前的。", "frustrate": "frustr（徒劳，同 fraud 的欺骗）+ ate。白费力气——使沮丧、挫败。", "intend": "in（往）+ tend（伸，同 tent）。心往那边伸——打算、想要。", "contain": "con（一起）+ tain（拿住）。全都拿住——包含、控制。", "politician": "politic（政治）+ ian（人）。搞政治的人——从政者、政客。", "expression": "express（表达）+ ion。表达出来的——措词、表情。", "security": "secur（安全，同 secure）+ ity。安全的状态——安全、证券。", "respondent": "respond（回答）+ ent（人）。回答的人——调查对象、被告。", "confrontation": "con（一起）+ front（脸）+ ation。脸对脸——对抗、冲突。", "guidance": "guid（引导，同 guide）+ ance。引着你走——指导、导航。", "microwave": "micro（微小）+ wave（波）。微小的波——微波、微波炉。", "overtime": "over（超过）+ time（时间）。超过时间——加班、加时赛。", "radical": "radio（无线电）没了o，像根天线直戳到底——钱花光了，问题从头到尾改了个彻底。", "bet": "爸（ba）说e（一）t（天）内必赢你——下注吧，我肯定你不敢。", "conform": "con（一起）+ form（形状），大家都一个形状——随大流。", "likely": "like（像）+ ly，事情像要发生——很可能。", "capability": "cap（帽子）= capacity（容量），能装多少本事——能力。", "carbon": "car（车）+ bon（棒），车棒燃烧后留下黑黑的碳——写错字用复写纸。", "announcement": "announce（宣布）+ ment（名词），大声说出来让大家知道——公告。", "soil": "s（蛇）+ oil（油），蛇油滴进泥里——土壤；油弄脏了衣服。", "an approach to sth": "approach（走近），走近一件事的方法——对某事的途径。", "confirm": "con（完全）+ firm（坚固），完全确定下来——证实、确认。", "critical": "critic（批评家）+ al，批评家总是挑毛病；关键时刻病危——批判的、危急的。", "administrative": "administer（管理）+ ative，管人管事的——行政的。", "equivalent": "equi（相等）+ val（价值）+ ent，价值相等——等同的、等价物。", "investigation": "invest（投资）+ i + gation，投资前总得先调查清楚——调查。", "forth": "for（为了）+ th（那），为了到那边去——向前、向外。", "impressive": "impress（压印）+ ive，在心里压出印子——印象深刻。", "goods": "good（好）的东西，大家都想买——商品、货物。", "including": "include（包含）+ ing，把…包进来——  "init（开始）＋iative。主动开头的那股劲儿——主动性；主动提的方案——倡议。", "democratic": "demo（人民）＋cratic（统治）。人民说了算——民主的。", "diet": "谐音“呆饿他”。天天吃草呆饿着——节食、日常饮食。", "realistic": "real（真实）＋istic。照真实来——现实的；真到像真的——逼真的。", "indicate": "in（进）＋dic（说）＋ate。说进去、指出来——表明、指示。", "beneficial": "bene（好）＋fic（做）＋ial。做好事——有益的。", "grant": "谐音“管他”。管他呢，准了——批准、拨款。", "evolutionary": "evolution（进化）＋ary。慢慢变出来的——进化的、逐渐发展的。", "applicant": "apply（申请）＋cant（人）。申请的那个人——申请人。", "prison": "谐音“不自由”。进去就不自由——监狱；困住你的地方也是。", "profession": "pro（公开）＋fess（说）＋ion。公开说自己靠啥吃饭——职业。", "desirable": "desire（渴望）＋able（可）。让人渴望的——理想的、值得拥有的。", "reserved": "reserve（保留）＋ed。话都保留着不说——内敛；座位保留着——预订的。", "exclude": "ex（出）＋clude（关）。关出门外——排斥、不包括。", "recognition": "re（再）＋cogn（知道）＋ition。再认出来——认出；大家再认你——认可、赞赏。", "campaign": "camp（营地）＋aign。扎营打仗——战役；扎营拉票——运动。", "conduct": "con（一起）＋duct（引导）。引导大家一起——实施、指挥；引导电——传导；引导自己——行为。", "risky": "risk（风险）＋y。带着风险味儿——危险的。", "tutor": "谐音“托他”。功课托他教——导师、家教。", "reject": "re（回）＋ject（扔）。扔回去——拒绝；被扔回来的——次品。", "identical": "ident（相同）＋ical。一个模子刻的——完全相同的。", "accounting": "account（账）＋ing。天天算账那行——会计。", "emergency": "e（出）+ merge（沉没）+ ncy。突然冒出来、把人往水里拽的事——紧急事件。", "rob": "r像刀，ob=object。拿刀对着目标——抢劫。", "assistance": "assist（帮忙）+ ance（名词）。搭把手这件事——援助。", "economic": "economy（经济）变形来的。跟钱袋子有关的——经济的。", "review": "re（再）+ view（看）。再看一遍，就是复习、回顾、审查。", "mineral": "mine（矿）+ ral。从矿里挖出来的东西——矿物。", "simplify": "simple（简单）+ ify（使…化）。把事整简单——简化。", "policy": "poli（城市）+ cy。管一座城的规矩——政策；保险单也是它。", "concentrate": "con（一起）+ centr（中心）+ ate。全往一个中心凑——集中、全神贯注。", "previous": "pre（先）+ vi（路）+ ous。走在前面那条路上的——先前的。", "supporter": "support（支持）+ er（人）。在后面撑着你的那个人——支持者。", "nature": "na（那）+ ture（真）。那真实的样子——自然、天性。", "delete": "谐音“得离他”。得离他远点——把他删掉。", "weaken": "weak（弱）+ en（使）。使变弱——削弱。", "phase": "谐音“费事”。每个费事的阶段，都得一步步过——阶段。", "upper": "up（上）+ per。往上那一边——上面的、上部的。", "gradual": "grad（步）+ ual。一步一步走的——逐渐的。", "promote": "pro（向前）+ mot（动）+ e。往前推一把——促进、晋升、推销。", "now that": "now（现在）+ that（那）。既然现在都这样了——既然。", "representative": "represent（代表）+ ative（人）。替大家出面的那个人——代表。", "prescribe": "pre（先）+ scribe（写）。医生先写张纸给你——开处方。", "appreciate": "ap + preci（价格）+ ate。看出价值——欣赏；别人对你好，就感激。", "revolution": "re（再）+ volut（转）+ ion。转一圈——旋转；转个大弯——革命。", "electrical": "electric（电）+ al。跟电有关的——电的、用电的。", "high-tech": "high（高）+ tech（技术）。技术堆得老高——高科技的。", "instructor": "instruct（教）+ or（人）。教你的人——教练、讲师。", "workforce": "work（工作）+ force（力量）。干活的那股人力——全体员工、劳动力。", "document": "doc（教）+ ument。用来教人、证明的东西——文件；也可以当动词记录。", "urgent": "urg（催）+ ent。有人在催你——紧迫的。", "hardware": "hard（硬）+ ware（物件）。硬邦邦的物件——硬件、五金。", "donation": "don（给）+ ation（名词）。给出去的东西——捐赠物。", "locate": "loc（地方）+ ate。找到那个地方——确定位置。", "given that": "given（给定的）+ that。把这事给定为前提——考虑到、鉴于。", "absorbed": "absorb（吸）+ ed。整个人被吸进去了——全神贯注的。", "requirement": "require（需要）+ ment（名词）。需要的东西——需求、必要条件。", "ideal": "idea（想法）+ l。心里那个完美想法——理想、理想的。", "awful": "aw（哎哟）+ ful（满）。哎哟满出来——极坏的、可怕的。", "approve": "ap + prove（证明）。证明行得通就点头——同意、批准。", "establishment": "establish（建立）+ ment（名词）。建起来的东西——机构、建立。", "enrich": "en（使）+ rich（富）。使富起来——充实、使丰富。", "form": "form 就是“形”。一个东西的模样、类型、表格，都是它存在的形状——形成就是让形状出现。", "engine": "en（使）+ gine（天生、产生）。让机器天生动起来的东西——发动机，引申为推动力。", "luggage": "lug（拖）+ gage（东西）。你要拖着走的一堆东西——行李。", "mainstream": "main（主要）+ stream（水流）。主流就是最大的那股水，大家都往那儿走。", "original": "origin（起源）+ al。从源头来的——起初的、原创的，原件就是最初那份。", "restrict": "re（往回）+ strict（拉紧）。往回拉紧绳子——限制、约束。", "unconscious": "un（不）+ conscious（有意识的）。意识不在线——不省人事，或者你没意识到。", "narrow": "谐音“耐揉”。路窄得只能耐着性子揉过去——狭窄的，缩小。", "alternative": "alter（改变）+ native（天生的）。换一个天生的选项——可替代的、非传统的。", "investor": "invest（投资）+ or（人）。往里投钱的人——投资者。", "equal": "equ（相等）+ al。平起平坐——相等、平等，也能说“比得上”。", "global": "globe（球）+ al。整个地球的事——全球的，也指全面的。", "supply": "sup（从下往上）+ ply（填满）。从下面往上填满——供应、补给。", "consultant": "consult（咨询）+ ant（人）。你花钱问的人——顾问，医院里就是会诊医师。", "dissolve": "dis（分开）+ solve（松开）。让东西松开分散——溶解，也指解散、消散。", "appointment": "appoint（指定）+ ment。指定一个时间见面——预约；指定一个职位——任命。", "worthy": "worth（值得）+ y。值得的——值得尊敬，也指值得的人，名词就是要人。", "ignorance": "ignore（忽视）+ ance。该知道的你忽视掉了——无知、愚昧。", "apparently": "apparent（明显的）+ ly。看起来明摆着——据说、看来、显然。", "real estate": "real（真的）+ estate（地产）。真金白银的不动产——房地产。", "recovery": "re（重新）+ cover（覆盖）+ y。重新盖回来——康复、恢复、收回。", "investigator": "investigate（调查）+ or（人）。专门查事情的人——调查者、侦查员。", "routine": "route（路线）+ ine。每天走同一条路线——惯例、常规，也指乏味。", "virtually": "virtual（虚拟的/实际上的）+ ly。在虚拟世界里——几乎、实际上。", "organize": "organ（器官）+ ize（使）。像器官一样各就各位——组织、整理。", "deed": "和 do（做）同源。你做的事——行为；做过的凭证——契约。", "illegal": "il（不）+ legal（合法的）。不合法——非法的，名词指非法移民。", "bar": "一根棒子横在门口——酒吧的吧台、律师界，也是闩门、阻挡、禁止。", "seminar": "semin（种子）+ ar。播撒知识种子的地方——研讨班、专题讨论会。", "farther": "far（远）+ ther（比较）。更远——时间空间都行。", "movement": "move（动）+ ment。动的状态——动作、移动，也指社会运动。", "illustrate": "il（使）+ lustr（光）+ ate。让光打上去——说明、阐明，也指加插图。", "react": "re（回）+ act（行动）。对事情回一个动作——反应，也指过敏、起化学反应。", "conference": "con（一起）+ fer（带来）+ ence。把大家带到一起——会议。", "specialist": "special（专门）+ ist（人）。专门搞一行的人——专家、专科医生。", "park": "公园是 park，停车也是 park。把车安顿在公园一样的地方——停车、泊车。", "optional": "option（选择）+ al。给你选项的——可选择的、非强制的。", "oppose": "op（相对）+ pose（放）。放在你对面——反对、阻挠。", "comparison": "compare（比较）+ ison。把两个东西放一起看——比较、对比。", "suburban": "sub（下面/靠近）+ urban（城市）。城市边上的——郊区的，也指平淡古板。", "relaxation": "re（回）+ lax（松）+ ation。绷紧的弦松回来——放松，放宽。", "swell": "s+well（井）。井水往上冒，鼓起来——肿胀、增大、海浪涌动。", "reception": "receive（接收）的名词。前台接你、信号接得住、欢迎会接客——接待处、接收效果。", "frequency": "frequent（频繁的）+ cy。频繁的程度——频率。", "philosophy": "philo（爱）+ sophy（智慧）。爱智慧——哲学、信条。", "intensive": "intense（ intense 紧张）来的。密度拉满——密集的、强化的。", "poisonous": "poison（毒）+ ous。带毒的——有毒的，也形容人嘴毒。", "generate": "gener（生）+ ate。生出电、生出主意——产生、发电。", "structure": "struct（建）+ ure。建起来的东西——结构、建筑物，也能当动词组织。", "tear down": "tear（撕）+ down（下）。往下撕——拆毁。", "remark": "re（再）+ mark（标记）。再标一笔——评论、意见。", "tedious": "谐音“提爹死”。提起来就烦——冗长乏味的。", "infer": "in（进）+ fer（带）。往里带出结论——推断。", "regulate": "regul（规则）+ ate。按规则来——管理、调节。", "decrease": "de（向下）+ crease（增长）。往下长——减少。", "lab": "laboratory 砍短了。做实验的小房间——实验室。", "applicable": "apply（应用）+ cable。能应用上去的——适用的。", "experimental": "experiment（实验）+ al。跟实验有关的——实验性的。", "proceed": "pro（向前）+ ceed（走）。往前走——继续、行进。", "region": "reg（统治）+ ion。被划出来管的一块——地区、区域。", "mislead": "mis（错）+ lead（带）。带错路——误导。", "compensation": "compensate（补偿）+ ion。补回来的那部分——赔偿金、薪酬。", "consequently": "consequent（随之而来的）+ ly。跟着来的结果——因此。", "agency": "agent（代理人）的名词。替人办事的机构——代理机构。", "deliver": "de（离开）+ liver（自由）。把东西放出去——递送、发表、接生。", "ambitious": "ambition（野心）+ ous。满脑子想往上爬——有野心的，也指规模宏大。", "mainland": "main（主要）+ land（陆地）。主要的陆地——大陆。", "barely": "bare（光秃秃）+ ly。光剩一点点——勉强、几乎不。", "unlike": "un（不）+ like（像）。不像——与…不同。", "excellence": "excel（超越）+ lence。超出去的那部分——优秀、卓越。", "occasion": "oc（向）+ cas（落下）+ ion。事情落下来的那个点——某次、场合、时机。", "significant": "sign（记号）+ fic（做）+ ant。做了记号值得注意——重要的、数量大的。", "primary": "prim（第一）+ ary。排第一的——首要的，也指最早的、小学的。", "hit": "一个拳头砸过去。打、击中，也指突然想到、很受欢迎。", "occupation": "occupy（占据）+ ation。占着你时间的事——职业，也指占领。", "mammal": "mamm（乳房）+ al。喂奶的动物——哺乳动物。", "criticism": "critic（批评家）+ ism。批评家干的事——批评、评论。", "pay off": "把钱付清，债没了；努力付清了，好结果就来了——成功、偿清。", "pressure": "press（压）+ ure。压着的状态——压力，也能当动词施压。", "sensitive": "sense（感觉）+ itive。感觉特别灵——敏感的、灵敏的，也指体贴的。", "fund": "fund 听着像“放的”。把一笔钱放那儿专门干一件事——基金、专款；掏钱资助也是它。", "vehicle": "vehi 像“vehicle”里的“way”，载你上路的那个东西——车辆；也是达成目的的工具。", "ruin": "ruin 读音像“入瘾”，一沾就全完蛋。房子塌成废墟，人也破产——毁掉。", "additional": "ad（加）+ dit（给）+ ional。往上再加一份——附加的、额外的。", "crowded": "crowd 人群 + ed。人挤人，挤得满满当当——拥挤的。", "handle": "hand（手）+ le。手能握住的地方是把手；能上手搞定就是处理。", "share": "share 像“晒”。东西晒出来大家分——分享、分担；分到的那一份就是股份。", "stem from sth": "stem 是茎，从茎里长出来——起源于、由…造成。", "naturally": "nature（自然）+ ally。顺着天性来，不拧巴——自然地、天生地。", "exhibit": "ex（出）+ hibit（拿）。把东西拿出来给人看——展览、表现出。", "efficiency": "efficient（高效的）+ cy。高效这件事本身——效率。", "dietary": "diet（饮食）+ ary。跟吃有关的——饮食的。", "expectation": "expect（期待）+ ation。心里等着的那件事——期望、预期。", "link": "link 读音像“领扣”。领扣把两片衣领扣一起——联系、链接。", "independence": "in（不）+ depend（依赖）+ ence。不靠别人——独立、自立。", "entertaining": "enter（进入）+ tain（持有）+ ing。能把人拉进状态里——有趣的、娱乐的。", "trace": "trace 像“追踪”的“追”。顺着痕迹一路找——追踪、追溯；留下的那点痕迹是微量。", "accompany": "ac（加强）+ company（同伴）。当你的同伴——陪伴、伴随。", "initially": "initial（最初的）+ ly。一开始那会儿——最初。", "cabin": "cab（出租车）+ in。出租车大小的空间——小木屋、客舱、船舱。", "occurrence": "occur（发生）+ rence。发生出来的那件事——事件；发生本身也是它。", "editor": "edit（编辑）+ or。干编辑这活儿的人——主编、编辑、剪辑师。", "steer": "steer 读音像“司机”。司机握着方向盘——驾驶、操纵、引导。", "specially": "special（特别）+ ly。专门为你特别来一趟——专门地、特意。", "be bound to do": "bound 是绑定的。跟这事绑死了，跑不掉——一定会、很可能会。", "triumph": "triumph 听着像“吹啊噗”。吹着号角凯旋——成功、胜利。", "explosion": "explode（爆炸）+ sion。炸开那一下——爆炸；数量炸开就是激增。", "shot": "shot 像“射它”。射出去那一下——射击、投篮；一针打进去也是 shot。", "gradually": "grade（等级）+ ually。一级一级往上爬——逐渐地。", "emergence": "emerge（浮现）+ ence。从水里冒出来那个动作——出现、显现。", "alarm": "al（全部）+ arm（武装）。所有人抄家伙起来——警报、惊恐。", "extensive": "ex（出）+ tens（伸展）+ ive。往外伸得很开——广阔的、广泛的。", "originate": "origin（起源）+ ate。从源头那儿出来——起源、创始。", "discharge": "dis（离开）+ charge（装填）。把装的东西卸出去——排出、放电；让人走就是解雇。", "reference": "refer（提到）+ ence。提到的那本书、那个人——参考、推荐信。", "immediately": "im（不）+ mediate（中间）+ ly。中间不带停的——立即、紧接地。", "oblige": "ob（对着）+ lige（绑）。被绑住了不得不做——强迫；帮人忙也是被情义绑住。", "per": "per 就三个字母，像“每”的拼音开头。每一个——每。", "indicator": "indicate（指示）+ or。指来指去的那个东西——指标、指示器、转向灯。", "helpless": "help（帮助）+ less（没有）。没人帮、使不上劲——无助的。", "old-fashioned": "old（旧）+ fashion（款式）+ ed。还穿着旧款——老式的、过时的。", "personnel": "person（人）+ nel。一个单位里所有人凑一块儿——人员、人事部。", "specify": "spec（看，像 inspect 里那个）+ ify（使）。让你看清楚说准——具体指明。", "observer": "observe（观察）+ er（人）。专门盯着看的人——观察员、目击者。", "philosophical": "philosophy（哲学）+ cal。爱智慧的人，看啥都通透——哲学的、豁达的。", "existence": "exist（存在）+ ence（名词）。活着、存在着这件事本身。", "up-to-date": "up（上）+ to + date（日期）。日期追到最新——新式的、信息不落伍的。", "upgrade": "up（向上）+ grade（等级）。等级往上提——升级、提拔。", "hunting": "hunt（追捕）+ ing。追着猎物跑，连找工作也叫 job hunting——打猎、搜寻。", "structural": "structure（结构）+ al。跟骨架构造有关的——结构上的。", "participation": "part（部分）+ icip + ation。把自己算进一部分——参与。", "refer to": "re（回）+ fer（带）。把话头带回来提到它——提到、指的是、查阅。", "evaluate": "e（出）+ valu（价值）+ ate。把价值算出来——评价、评估。", "plot": "谐音“扑啦特”——故事扑朔迷离，还有阴谋，也能指一块地——情节、密谋。", "ultimately": "ultimate（最终的）+ ly。走到最末尾那一步——最终、归根结底。", "opponent": "op（反）+ pon（放）+ ent（人）。站在你对面放招的人——对手、反对者。", "meaningful": "meaning（意义）+ ful（满）。装满意义的——有意义的、意味深长的。", "youngster": "young（年轻）+ ster（人）。小年轻一个——小孩、年轻人。", "commute": "com（一起）+ mute（变）。每天来回变位置，从家变到公司——通勤。", "furthermore": "further（更远）+ more（更多）。再往前加一层——而且、此外。", "ambition": "ambi（周围）+ tion。想把手伸向四面八方——野心、抱负。", "select": "se（分开）+ lect（挑，像 elect 选举）。从一堆里挑出来分开——选择，挑出来的就是精选的。", "variety": "vary（变化）+ ety（名词）。变来变去花样多——各种各样，种类。", "fairly": "fair（公平的）+ ly。公平地办事，程度也刚刚好——相当地，公正地。", "opposed": "op（对着）+ pos（放）+ ed。放在你对面——反对的，对立的。", "equality": "equal（相等）+ ity（名词）。大家都一样——平等。", "isolate": "i（我）+ so（如此）+ late（晚）。我这么晚一个人待着——被孤立，分离。", "maintain": "main（主要）+ tain（拿住，像 contain）。主要靠手拿住不放——维持，保养，坚称。", "outdated": "out（出去）+ date（日期）+ ed。日期都过出去了——过时的，老式的。", "regular": "reg（规则，像 regulation）+ ular。按规则来的——有规律的，常客。", "location": "loc（地方，像 local）+ ation（名词）。在哪个地方——地点，位置。", "predict": "pre（提前）+ dict（说，像 dictionary）。提前说出来——预言，预测。", "put up": "put（放）+ up（上去）。往上放——搭起来是建造，贴上去是张贴，价格往上放是提高。", "violent": "viol（力，像 violate 侵犯）+ ent。用暴力使劲——暴力的，剧烈的。", "enforce": "en（使）+ force（力量）。使劲儿让它生效——强制执行，迫使。", "technique": "techn（技术，像 technology）+ ique。技术那套活儿——技巧，技艺。", "shortcoming": "short（短）+ coming（来的）。短处冒出来了——缺点，短处。", "simplicity": "simple（简单）+ icity（名词）。简单本身——简单，质朴。", "motivation": "motiv（动，像 motor 马达）+ ation。心里有个马达在推——动力，动机。", "value": "val（值，像 valuable）。值多少——价值，重视。", "related": "relate（联系）+ ed。连在一起的——相关的，有亲戚关系的。", "equipment": "equip（装备）+ ment（名词）。装备起来的东西——设备，配备。", "deposit": "de（往下）+ posit（放，像 position）。往下放——存钱，押金，沉积物。", "athletic": "athlet（运动员）+ ic。运动员那样的——健壮的，运动的。", "promotion": "pro（往前）+ mot（动）+ ion。往前动一步——晋升，促销。", "tailor": "tail（尾巴）+ or（人）。给人量尾巴做衣服的人——裁缝，定做。", "patch": "谐音“拍纸”。拍块纸在破洞上——补丁，小块，打补丁。", "consciousness": "conscious（有意识的）+ ness（名词）。有意识的状态——知觉，意识。", "undergraduate": "under（下面）+ graduate（毕业生）。还没毕业、在下面的——在校本科生。", "existing": "exist（存在）+ ing。正在存在着的——目前的，现存的。", "enrollment": "enroll（注册，en 进 + roll 名单）+ ment。名字进名单——登记，注册。", "well-known": "well（很）+ known（知道的）。大家都知道——著名的，熟知的。", "specifically": "specific（具体的）+ ally。具体到点上——明确地，专门地。", "permission": "per（通过）+ miss（放，像 mission）+ ion。放你通过——许可，批准。", "occasionally": "occasion（场合）+ ally。只在某些场合出现——偶尔，有时。", "professional": "profession（职业）+ al。靠这个职业吃饭的——职业的，专业人士。", "significance": "sign（标志）+ ific（做）+ ance。能当标志的事——重要性，意义。", "component": "com（一起）+ pon（放，像 pose）+ ent。放到一起拼起来的部分——成分，部件。", "frustration": "frustr（碎，像 frustrate 挫败）+ ation。心碎了——沮丧，懊恼。", "currently": "current（当前流动的）+ ly。像水流到现在——目前，当前。", "matter": "谐音“买它”。买它是个要紧的事，也是个物质的东西——事情，要紧，物质。", "container": "con（一起）+ tain（拿住）+ er（东西）。把东西都拿住收在一起——容器，装货的就是集装箱。", "valid": "val（强壮，像 value 有价值）+ id。站得住脚的——有效的、合理的。", "embarrassment": "em（进）+ barr（栏杆，挡）+ ass（驴）——驴被拦在栏杆里，进退两难。尴尬到想钻地缝。", "slightly": "slight（轻微的）+ ly。就那么一丢丢——稍微。", "opposition": "opposite（对面的）+ ion。站你对面的人——反对派、对手。", "volunteer": "volunt（意愿，像 voluntary 自愿的）+ eer（人）。自己愿意上的人——志愿者。", "arrange": "ar（去）+ range（排列）。把事一排一排摆好——安排、布置。", "possibly": "possible（可能的）+ ly。可能吧，或许吧——possibly。", "prevention": "pre（提前）+ vent（来）+ ion。提前挡在它来之前——预防。", "junk": "谐音“囧客”——收破烂的囧客。废品、垃圾，垃圾食品也叫 junk food。", "productivity": "product（产品）+ ivity（能力）。能产出多少的能力——生产力。", "elevate": "e（出）+ lev（举起，像 elevator 电梯）+ ate。把你往上举——提拔、提升。", "gathering": "gather（聚拢）+ ing。人往一块儿凑——聚会、集会。", "anyhow": "any（任何）+ how（方式）。不管怎样都行——无论如何、反正。", "resort to sth": "re（反复）+ sort（找）。反复找不到别的路，只好去找它——诉诸、求助。", "referee": "refer（参考、交给）+ ee（人）。有争议就交给他——裁判、仲裁员。", "with regard to": "with（带着）+ regard（目光、注意）。把目光转到这儿——关于、至于。", "expectancy": "expect（期待）+ ancy（状态）。等着的那个劲儿——期待、期望。", "appreciation": "appreciate（欣赏、感激）+ ion。心里那点欣赏和感谢——欣赏、感激。", "procedure": "pro（向前）+ ced（走）+ ure。一步步往前走——步骤、程序。", "advancement": "advance（前进）+ ment。往前走这件事——进步、晋升。", "departure": "depart（离开）+ ure。走人这件事——离开、出发。", "supportive": "support（支持）+ ive。给你撑腰的——支持的、给帮助的。", "reluctant": "re（反）+ luct（挣扎）+ ant。心里一直挣扎不想动——勉强的。", "network": "net（网）+ work（工作）。网一样干活的结构——网络、关系网。", "regulation": "regulate（管理、调控）+ ion。管着你的东西——规章、制度。", "concerning": "concern（担心、涉及）+ ing。关于那件事，让人有点担心——关于。", "make sense": "make（造）+ sense（道理）。能造出道理来——讲得通。", "delivery": "deliver（递送、分娩）+ y。把东西送出来，孩子生出来——递送、分娩。", "signature": "sign（签名）+ ature。你签下的那个名，也是你的鲜明标志——签名、特征。", "valuable": "value（价值）+ able（能）。有价值能换钱的——珍贵的、值钱的。", "edition": "edit（编辑）+ ion。编出来的那一版——版本、版次。", "remarkable": "remark（评论、注意）+ able。值得被评论的——非凡的、不同寻常的。", "supplier": "supply（供应）+ er（人）。给你供货的那个人——供应商。", "admission": "admit（准许进入、承认）+ sion。让你进去，或者承认——准入、承认、门票钱。", "primarily": "primary（主要的）+ ly。主要地，首先地——primarily。", "dependence": "depend（依靠）+ ence。靠上去的状态——依赖，靠久了就上瘾。", "injury": "in（不）+ jur（法律、公正，像 jury）。不公正地对你——伤害、损害。", "performance": "perform（表演、执行）+ ance。表演出来、执行出来——演出、表现、性能。", "concentration": "con（一起）+ centr（中心）+ ation。全往一个中心凑——全神贯注、浓度。", "sensible": "sense（感觉、判断）来的。有判断力——明智的，也指人很讲道理、意识得到事儿。", "assembly": "as（往）+ sembl（相似，像 same）。把相似的人凑一起——集会；零件拼一块——组装。", "restriction": "restrict（限制）+ ion。像一根绳把你圈住——限制、约束。", "contribution": "contribute（贡献）变来的。你掏出来的东西——贡献、捐款，投给杂志就是稿件。", "reform": "re（再来）+ form（形状）。重新塑形——改革；人也重新做人——改过自新。", "tip": "给小费靠一句小建议，笔尖叫尖端，桌子一歪就倒出来。全是它。", "dispute": "dis（分开）+ pute（想，像 compute）。两边想不到一块——争论、争端。", "presentation": "present（呈现）+ ation。把东西摆到人前——演示、报告；发奖也是呈上。", "photographer": "photo（光）+ graph（写）+ er（人）。用光写字的人——摄影师。", "motor": "mot（动，像 motion）+ or（物）。让它动起来的东西——马达、发动机，也指汽车。", "reasonable": "reason（道理）+ able（能）。讲得出道理的——合理的；价钱公道也是它。", "survival": "survive（活下来）+ al。活过灾难那件事——幸存、生存。", "affection": "affect（影响）+ ion。心里被戳动了——喜爱、爱慕那点情。", "philosopher": "philo（爱）+ soph（智慧）+ er（人）。爱智慧的人——哲学家。", "technological": "technology（技术）+ ical。跟技术挂钩的——科技的、工艺的。", "particle": "part（部分）+ icle（小）。整体里的一小份——微粒、粒子；语法里的小品词。", "entitle": "en（使）+ title（头衔、标题）。给你一个名分——给权利；加个标题——给…题名。", "infrastructure": "infra（下面）+ structure（结构）。底下撑着的结构——基础设施。", "sociable": "soci（社会、伙伴，像 social）+ able。能跟人凑一块的——爱交际、合群。", "ultimate": "ultim（最远，像 ultimatum 最后通牒）+ ate。走到最远那头——最终的、极度的。", "indifferent": "in（不）+ different（不同）。你跟别人没差别，我懒得管——不感兴趣、冷淡。", "executive": "execute（执行）+ ive。负责执行的人——主管、经理；执行部门。", "reward": "re（回）+ ward（朝）。朝你回过来的好处——奖赏、回报。", "assure": "as（去）+ sure（确定）。把确定塞给对方——向…保证、确保。", "precisely": "precise（精确）+ ly。切得正正好好——精确地；回答时“恰恰如此”。", "means": "mean（中间、手段）加 s。夹在你和目的中间的东西——方法；攒下来的——钱财。", "psychological": "psycho（心理，像 psyche 灵魂）+ logical。跟心里那套有关的——心理的。", "demanding": "demand（要求）+ ing。要求一个接一个——要求很高、苛刻的。", "viewer": "view（看）+ er（人）。看的人——观众；看片子的机器——幻灯机。", "foster": "f 。医生提前写好的条子——处方。", "isolation": "isolate（隔离）+ ion。被隔到一座孤岛上——隔绝、孤独。", "selection": "select（挑选）+ ion。挑出来的过程或结果——挑选、入选者。", "psychologist": "psycho（心理）+ logist（学家）。研究心理的人——心理学家。", "visa": "谐音「威撒」。护照上盖个威风的章，才能撒出去——签证。", "forceful": "force（力量）+ ful。满满都是劲——强有力的、有说服力的。", "variation": "vary（变化）+ ation。变出来的花样——变化、变体。", "complex": "com（一起）+ plex（编织，像编织的网）。缠在一起——复杂的；也指建筑群。", "obliged": "oblige（迫使、施恩）+ ed。被人家帮过，欠着情——感激的；必须的。", "extension": "ex（往外）+ tens（伸）+ ion。往外伸出去的部分——延伸、扩建、分机。", "voluntary": "volunt（意愿，像 volunteer）+ ary。出于自己意愿的——自愿的、无偿的。", "funding": "fund（资金）+ ing。给钱这件事——资金、拨款。"};

/* 哥哥亲手写到第几条——宝宝只背这部分 */
var MINE_UPTO = 1150;

/* ============ 状态 ============ */
var KEY = 'shenyu_vocab_v2';
var DAYS = [1,2,4,7,15];
var DEFAULTS = {settings:{rand:true, daily:20, rmin:15, rmax:25, quiz:10, revCap:10},
                stats:{days:0, words:0, last:''}};
var S = load();

/* 顺序版升级：今天还没开始背的话，自动重摇成按顺序的 */
(function(){
  try{
    if(S.today && S.today.date===todayStr() && !S.today.seq && !S.today.ptr){
      var w0 = S.stats.words||0, d0 = S.stats.days||0;
      buildToday(true);
      S.stats.words = w0; S.stats.days = d0; save();
    }
  }catch(e){}
})();

function load(){
  var d = JSON.parse(JSON.stringify(DEFAULTS));
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o.settings) for(var k in o.settings) d.settings[k]=o.settings[k];
      if(o.stats) for(var k in o.stats) d.stats[k]=o.stats[k];
      if(o.today) d.today=o.today;
      if(o.seen) d.seen=o.seen;
      if(o.review) d.review=o.review;
      if(o.quizzed) d.quizzed=o.quizzed;
    }
  }catch(e){}
  if(!d.seen) d.seen={};
  if(!d.review) d.review={};
  if(!d.quizzed) d.quizzed={};
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function todayStr(){
  var t=new Date();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
function addDays(str, n){
  var p = str.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function randInt(a,b){ a=Math.ceil(a); b=Math.floor(b); if(b<a) b=a; return a+Math.floor(Math.random()*(b-a+1)); }
function shuffle(arr){ for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;} return arr; }

function quota(){
  if(S.settings.rand) return randInt(S.settings.rmin, S.settings.rmax);
  return S.settings.daily;
}
function buildToday(force){
  var t = todayStr();
  if(force || !S.today || S.today.date !== t){
    var n = Math.min(quota(), WORDS.length);

    // 1) 今天到期的复习词
    var due = [];
    for(var k in S.review){ if(S.review[k].due <= t) due.push(parseInt(k,10)); }
    due.sort(function(a,b){return a-b;});
    var cap = Math.max(1, Math.min(S.settings.revCap, Math.floor(n/2)));
    var rev = due.slice(0, cap);

    // 2) 没背过的新词：只取哥哥写完钩子的，按序号从小到大，不随机
    var fresh = [];
    for(var i=0;i<WORDS.length;i++){
      if(!S.seen[i] && i < MINE_UPTO) fresh.push(i);
    }
    var news = fresh.slice(0, Math.max(0, n - rev.length));

    var list = rev.concat(news);

    // 3) 哥哥写完的词就这么多——不够就少背几个，不拿没编的词凑数
    if(list.length < n){
      for(var j=0;j<WORDS.length && j<MINE_UPTO && list.length<n;j++){
        if(list.indexOf(j)>=0) continue;
        list.push(j);
      }
    }

    var revFlag = {};
    for(var r=0;r<rev.length;r++) revFlag[rev[r]] = 1;
    for(var q=0;q<list.length;q++) S.seen[list[q]] = 1;

    S.today = {date:t, list:list, ptr:0, unknown:[], round:1, finished:false, revFlag:revFlag, seq:1};
    S.stats.days = (S.stats.days||0) + (force?0:1);
    S.stats.words = (S.stats.words||0) + news.length;
    S.stats.last = t;
    save();
  }
  return S.today;
}
/* 背完一个词，排下一次复习：1 / 2 / 4 / 7 / 15 天，第五次答对就毕业 */
function gradeWord(v, ok){
  var t = todayStr();
  var r = S.review[v];
  if(!r){ r = S.review[v] = {s:0, due:t, n:0}; }
  r.n = (r.n||0)+1;
  if(ok){
    r.s = (r.s||0)+1;
    if(r.s > DAYS.length){ delete S.review[v]; return; }
    r.due = addDays(t, DAYS[Math.min(r.s-1, DAYS.length-1)]);
  }else{
    r.s = 0;
    r.due = addDays(t, 1);
  }
}

/* ============ 视图 ============ */
function show(p){
  var ps = document.querySelectorAll('.page'), as = document.querySelectorAll('nav a');
  for(var i=0;i<ps.length;i++) ps[i].classList.toggle('on', ps[i].id === 'p-'+p);
  for(var j=0;j<as.length;j++) as[j].classList.toggle('on', as[j].getAttribute('data-p') === p);
  if(p==='quiz') renderQuiz();
  if(p==='set') renderSet();
  if(p==='study') renderStudy();
  window.scrollTo(0,0);
}

function renderSub(){
  var t = S.today;
  var d = new Date();
  var wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  var rand = S.settings.rand ? ('随机 '+S.settings.rmin+'~'+S.settings.rmax) : ('固定 '+S.settings.daily);
  document.getElementById('sub').textContent =
    t.date + ' ' + wk + ' · 今天 ' + t.list.length + ' 个 · ' + rand;
}

function renderStudy(){
  var t = S.today, body = document.getElementById('studyBody');
  var shown = t.ptr;
  document.getElementById('ptext').textContent = shown + ' / ' + t.list.length;
  document.getElementById('pfill').style.width = (t.list.length? (shown/t.list.length*100):0) + '%';
  renderSub();

  if(t.finished || t.ptr >= t.list.length){
    var un = (t.unknown||[]).length;
    body.innerHTML = '<div class="done-box"><div class="big">'+(un? '🌙':'✅')+'</div>'+
      '<p>'+(un? '这一轮过完了，还有 '+un+' 个没吃透。<br>再刷一遍？':'今天背完了。')+'</p></div>'+
      (un? '<button class="gold wide" onclick="startRound2()">再刷这 '+un+' 个</button>':'')+
      '<button class="wide ghost" onclick="reroll()">重摇一批</button>';
    return;
  }

  var idx = t.list[t.ptr];
  var wi = WORDS[idx];
  var isRev = t.revFlag && t.revFlag[idx];
  var hk = HOOKS[wi.en.toLowerCase()];
  body.innerHTML =
    (isRev ? '<div class="revtag">复习</div>' : '')+
    '<div class="card" id="card" onclick="reveal()">'+
      '<div class="en">'+esc(wi.en)+'</div>'+
      '<div class="revealbox" id="revealBox">'+
        '<div class="cn">'+esc(wi.cn)+'</div>'+
        (hk ? '<div class="hook"><b>哥哥讲</b>'+esc(hk)+'</div>'
            : '<div class="nohook">这个词哥哥还没给你编。<br>晚上拿它来问哥哥，让他当场给你讲一个。</div>')+
      '</div>'+
      '<div class="tip" id="tipx">点一下看意思</div>'+
    '</div>'+
    '<div class="actions" id="acts" style="visibility:hidden">'+
      '<button class="ok" onclick="mark(1)">会了 ✓</button>'+
      '<button class="no" onclick="mark(0)">不会 ✗</button>'+
    '</div>';
  window.__shown = false;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function reveal(){
  if(window.__shown) return;
  window.__shown = true;
  var box = document.getElementById('revealBox');
  if(box) box.classList.add('show');
  var tip = document.getElementById('tipx');
  if(tip && tip.parentNode) tip.parentNode.removeChild(tip);
  var acts = document.getElementById('acts');
  if(acts) acts.style.visibility = 'visible';
}

function mark(ok){
  var t = S.today;
  var v = t.list[t.ptr];
  if(!ok && t.unknown.indexOf(v) < 0) t.unknown.push(v);
  gradeWord(v, !!ok);
  t.ptr++;
  save();
  renderStudy();
}

function startRound2(){
  var t = S.today;
  t.list = shuffle(t.unknown.slice());
  t.unknown = [];
  t.ptr = 0;
  t.round = (t.round||1)+1;
  save();
  renderStudy();
}

function reroll(){
  buildToday(true);
  renderStudy();
}

/* ============ 抽查 ============ */
var Q = null;
function renderQuiz(){
  var t = S.today, body = document.getElementById('quizBody');
  if(!Q){
    body.innerHTML = '<div class="done-box"><div class="big">✍️</div>'+
      '<p>从今天背过的词里随机抽 '+S.settings.quiz+' 个。<br>哥哥看你能记住几个。</p></div>'+
      '<button class="gold wide" onclick="startQuiz()">开始抽查</button>';
    return;
  }
  if(Q.i >= Q.items.length){
    var right = Q.right, tot = Q.items.length;
    var word = right===tot ? '全对，哥哥给你记一笔。' : (right>=tot*0.7 ? '还行，没白背。' : '差的有点多，回头再刷。');
    body.innerHTML = '<div class="done-box"><div class="big">'+(right===tot?'🏆':'📊')+'</div>'+
      '<p style="font-size:22px;color:var(--fg);font-weight:700">'+right+' / '+tot+'</p><p>'+word+'</p></div>'+
      '<button class="gold wide" onclick="Q=null;renderQuiz()">再来一组</button>'+
      '<button class="ghost wide" onclick="Q=null;show(\'study\')">回去背</button>';
    return;
  }
  var it = Q.items[Q.i];
  var wi = WORDS[it];
  var ask = Q.dir[Q.i] === 0 ? wi.cn : wi.en;
  var ans = Q.dir[Q.i] === 0 ? wi.en : wi.cn;
  var hk = HOOKS[wi.en.toLowerCase()];
  body.innerHTML =
    '<div class="pwrap"><div class="pbar"><i style="width:'+(Q.i/Q.items.length*100)+'%"></i></div>'+
    '<div class="ptext">'+(Q.i+1)+' / '+Q.items.length+'</div></div>'+
    '<div class="card" id="qcard" onclick="qflip()">'+
      '<div class="'+(Q.dir[Q.i]===0?'cn':'en')+'" style="font-size:'+(Q.dir[Q.i]===0?'21px':'38px')+'">'+esc(ask)+'</div>'+
      '<div class="tip">'+(Q.dir[Q.i]===0?'说出它的英文':'说出它的中文')+'</div>'+
    '</div>'+
    '<div class="actions" id="qacts" style="visibility:hidden">'+
      '<button class="ok" onclick="qmark(1)">记住了</button>'+
      '<button class="no" onclick="qmark(0)">忘了</button>'+
    '</div>';
  window.__qflipped = false;
}
function startQuiz(){
  var t = S.today;
  var pool = t.list.slice();
  if(!pool.length) return;
  // 被抽中次数少的优先 —— 每次抽的都不一样，天天不重样
  var scored = pool.map(function(v){ return {v:v, c:S.quizzed[v]||0, r:Math.random()}; });
  scored.sort(function(a,b){ return (a.c-b.c) || (a.r-b.r); });
  var n = Math.min(S.settings.quiz, scored.length);
  var picked = scored.slice(0,n).map(function(o){ return o.v; });
  for(var i=0;i<picked.length;i++){ S.quizzed[picked[i]] = (S.quizzed[picked[i]]||0)+1; }
  save();
  Q = {items:picked, dir:picked.map(function(){return Math.random()<.5?0:1;}), i:0, right:0};
  renderQuiz();
}
function qflip(){
  if(window.__qflipped) return;
  window.__qflipped = true;
  var it = Q.items[Q.i], wi = WORDS[it];
  var ans = Q.dir[Q.i]===0 ? wi.en : wi.cn;
  var hk = HOOKS[wi.en.toLowerCase()];
  document.getElementById('qcard').innerHTML =
    '<div class="cn" style="font-size:22px">'+esc(ans)+'</div>'+
    (hk? '<div class="hook"><b>哥哥讲</b>'+esc(hk)+'</div>':'');
  document.getElementById('qacts').style.visibility='visible';
}
function qmark(ok){
  if(ok) Q.right++;
  Q.i++;
  renderQuiz();
}

/* ============ 设置 ============ */
function renderSet(){
  document.getElementById('s-rand').checked = !!S.settings.rand;
  document.getElementById('s-daily').value = S.settings.daily;
  document.getElementById('s-min').value = S.settings.rmin;
  document.getElementById('s-max').value = S.settings.rmax;
  document.getElementById('s-quiz').value = S.settings.quiz;
  document.getElementById('s-revcap').value = S.settings.revCap;
  document.getElementById('st-total').textContent = WORDS.length;
  document.getElementById('st-days').textContent = S.stats.days||0;
  document.getElementById('st-words').textContent = S.stats.words||0;
  var td = todayStr(), dc = 0;
  for(var k in S.review){ if(S.review[k].due <= td) dc++; }
  document.getElementById('st-due').textContent = dc;
}
function bindSet(){
  document.getElementById('s-rand').onchange = function(){ S.settings.rand=this.checked; save(); renderSub(); };
  document.getElementById('s-daily').onchange = function(){ S.settings.daily=clamp(this.value,1,200); this.value=S.settings.daily; save(); renderSub(); };
  document.getElementById('s-min').onchange = function(){ S.settings.rmin=clamp(this.value,1,200); this.value=S.settings.rmin; save(); renderSub(); };
  document.getElementById('s-max').onchange = function(){ S.settings.rmax=clamp(this.value,1,200); this.value=S.settings.rmax; save(); renderSub(); };
  document.getElementById('s-quiz').onchange = function(){ S.settings.quiz=clamp(this.value,1,100); this.value=S.settings.quiz; save(); };
  document.getElementById('s-revcap').onchange = function(){ S.settings.revCap=clamp(this.value,1,80); this.value=S.settings.revCap; save(); renderSet(); };
  document.getElementById('btn-resetToday').onclick = function(){
    if(confirm('重摇今天的 '+S.today.list.length+' 个词？')){ Q=null; reroll(); show('study'); }
  };
  document.getElementById('btn-resetAll').onclick = function(){
    if(confirm('清空全部记录？打卡天数和进度都会没。')){
      try{localStorage.removeItem(KEY);}catch(e){}
      S = JSON.parse(JSON.stringify(DEFAULTS));
      Q=null; buildToday(true); show('study');
    }
  };
  var as = document.querySelectorAll('nav a');
  for(var i=0;i<as.length;i++) as[i].onclick = function(e){ e.preventDefault(); show(this.getAttribute('data-p')); };
}
function clamp(v,a,b){ v=parseInt(v,10)||a; return Math.max(a,Math.min(b,v)); }

/* ============ 启动 ============ */
bindSet();
buildToday(false);
renderStudy();
save();
</script>
